[package]
name = "atlas-pc"
version = "1.0.0"
description = "ATLAS PC - Inventaire et Gestion de votre ordinateur"
authors = ["ATLAS PC Team"]
edition = "2021"

[lib]
name = "atlas_pc_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
